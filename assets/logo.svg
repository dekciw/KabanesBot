<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Morning Bot">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.55" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FFE29A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <!-- rays -->
    <g stroke="#FFF4C2" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="64" y1="14" x2="64" y2="26"/>
      <line x1="28" y1="30" x2="36" y2="38"/>
      <line x1="100" y1="30" x2="92" y2="38"/>
      <line x1="14" y1="62" x2="26" y2="62"/>
      <line x1="114" y1="62" x2="102" y2="62"/>
    </g>
    <!-- sun -->
    <circle cx="64" cy="66" r="28" fill="url(#sun)"/>
    <!-- chat bubble (Telegram blue) -->
    <path d="M18 78 h92 a8 8 0 0 1 8 8 v34 a8 8 0 0 1 -8 8 H18 a8 8 0 0 1 -8 -8 V86 a8 8 0 0 1 8 -8 z" fill="#2AABEE"/>
    <!-- paper plane -->
    <path d="M40 103 l46 -16 l-9 32 l-12 -10 l-7 7 v-11 z" fill="#ffffff"/>
    <path d="M58 105 l28 -18 l-21 22 z" fill="#D7EEFB"/>
  </g>
</svg>
